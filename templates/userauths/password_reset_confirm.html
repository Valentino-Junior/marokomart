{% extends 'partials/base.html' %}
{% load static %}
{% block content %}

<style>
    .password-reset-form {
        max-width: 450px;
        margin: 0 auto;
        padding: 40px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        border-radius: 15px;
        background-color: white;
    }

    .form-title {
        text-align: center;
        margin-bottom: 20px;
        font-size: 28px;
        color: #333;
        margin-top: -20px; /* Adjusted title position */
    }

    .form-subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
        line-height: 1.6;
    }

    .form-group {
        margin-bottom: 1.5rem;
        position: relative;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        transition: all 0.3s ease;
        font-size: 14px;
        padding-right: 45px;
    }

    .form-control:focus {
        border-color: #3BB77E;
        box-shadow: 0 0 0 2px rgba(59, 183, 126, 0.1);
        outline: none;
    }

    .password-field {
        position: relative;
    }

    .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        color: #666;
        transition: all 0.3s ease;
        z-index: 2;
    }

    .toggle-password:hover {
        color: #333;
    }

    .toggle-password:focus {
        outline: none;
        color: #3BB77E;
    }

    .password-strength {
        height: 4px;
        background: #ddd;
        border-radius: 2px;
        margin-top: 8px;
        overflow: hidden;
    }

    .password-strength-bar {
        height: 100%;
        width: 0;
        transition: width 0.3s ease, background-color 0.3s ease;
    }

    .password-validation {
        margin-top: 5px;
        font-size: 12px;
        color: #666;
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        background: #3BB77E;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.3s ease;
        cursor: pointer;
        position: relative;
        overflow: hidden;
    }

    .btn-submit:hover {
        background: #2a8c5e;
        transform: translateY(-2px);
    }

    .btn-submit.loading {
        pointer-events: none;
        opacity: 0.8;
    }

    .btn-submit.loading::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        top: 50%;
        left: 50%;
        margin: -10px 0 0 -10px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s infinite linear;
    }

    .alert {
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 8px;
        animation: slideIn 0.3s ease;
        display: none;
    }

    .alert-success {
        background-color: #d4edda;
        border: 1px solid #c3e6cb;
        color: #155724;
    }

    .alert-error {
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
    }

    @keyframes slideIn {
        from {
            transform: translateY(-10px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .page-content {
        padding-top: 100px; /* Reduced top padding */
        padding-bottom: 100px;
    }

    .back-to-login {
        text-align: center;
        margin-top: 20px;
    }

    .back-to-login a {
        color: #3BB77E;
        text-decoration: none;
        font-size: 14px;
        position: relative;
    }

    .back-to-login a::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 2px;
        bottom: -2px;
        left: 0;
        background-color: #3BB77E;
        transform: scaleX(0);
        transition: transform 0.3s ease;
    }

    .back-to-login a:hover::after {
        transform: scaleX(1);
    }
</style>

<main class="main pages">
    <div class="page-content pt-40">
        <div class="container">
            <div class="row">
                <div class="col-xl-6 col-lg-8 col-md-12 m-auto">
                    <div class="password-reset-form">
                        <h1 class="form-title">Set New Password</h1>
                        <p class="form-subtitle">Please enter your new password below.</p>

                        <div class="alert" id="alertMessage"></div>

                        <form method="POST" id="passwordResetForm">
                            {% csrf_token %}
                            <div class="form-group password-field">
                                <input type="password" name="password1" required 
                                       class="form-control" placeholder="New password" />
                                <button type="button" class="toggle-password">
                                    <i class="fi-rs-eye"></i>
                                </button>
                                <div class="password-strength">
                                    <div class="password-strength-bar"></div>
                                </div>
                                <div class="password-validation"></div>
                            </div>

                            <div class="form-group password-field">
                                <input type="password" name="password2" required 
                                       class="form-control" placeholder="Confirm password" />
                                <button type="button" class="toggle-password">
                                    <i class="fi-rs-eye"></i>
                                </button>
                            </div>

                            <div class="form-group">
                                <button type="submit" class="btn-submit" id="submitBtn">
                                    Reset Password
                                </button>
                            </div>
                        </form>

                        <div class="back-to-login">
                            <a href="{% url 'userauths:sign-in' %}">Back to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('passwordResetForm');
    const password1 = form.querySelector('input[name="password1"]');
    const password2 = form.querySelector('input[name="password2"]');
    const strengthBar = document.querySelector('.password-strength-bar');
    const validation = document.querySelector('.password-validation');
    const submitBtn = document.getElementById('submitBtn');
    const alertMessage = document.getElementById('alertMessage');

    function showAlert(message, type) {
        alertMessage.className = 'alert alert-' + type;
        alertMessage.textContent = message;
        alertMessage.style.display = 'block';
        
        if (type === 'success') {
            setTimeout(() => {
                window.location.href = "{% url 'userauths:sign-in' %}";
            }, 2000);
        }
    }

    // Password strength check
    function calculatePasswordStrength(password) {
        let score = 0;
        let message = '';
        let color = '#dc3545';

        if (password.length >= 8) score += 20;
        if (password.length >= 12) score += 20;
        if (/[A-Z]/.test(password)) score += 20;
        if (/[0-9]/.test(password)) score += 20;
        if (/[^A-Za-z0-9]/.test(password)) score += 20;

        if (score < 40) {
            message = 'Weak password';
            color = '#dc3545';
        } else if (score < 80) {
            message = 'Moderate password';
            color = '#ffc107';
        } else {
            message = 'Strong password';
            color = '#28a745';
        }

        return { score, message, color };
    }

    password1.addEventListener('input', function() {
        const strength = calculatePasswordStrength(this.value);
        strengthBar.style.width = strength.score + '%';
        strengthBar.style.backgroundColor = strength.color;
        validation.textContent = strength.message;
        validation.style.color = strength.color;
    });

    // Password visibility toggle
    document.querySelectorAll('.toggle-password').forEach(button => {
        button.addEventListener('click', function(e) {
            e.preventDefault();
            const input = this.parentElement.querySelector('input');
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            
            const icon = this.querySelector('i');
            icon.className = type === 'password' ? 'fi-rs-eye' : 'fi-rs-eye-crossed';
            
            // Add animation
            icon.style.transform = 'scale(0.8)';
            setTimeout(() => {
                icon.style.transform = 'scale(1)';
            }, 100);
        });
    });

    // Form submission
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        
        if (password1.value !== password2.value) {
            showAlert('Passwords do not match!', 'error');
            return;
        }

        submitBtn.classList.add('loading');
        submitBtn.disabled = true;

        const formData = new FormData(this);

        fetch(window.location.href, {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showAlert(data.message, 'success');
                if (data.redirect_url) {
                    setTimeout(() => {
                        window.location.href = data.redirect_url;
                    }, 2000);
                }
            } else {
                showAlert(data.message, 'error');
            }
        })
        .catch(error => {
            showAlert('An error occurred. Please try again.', 'error');
        })
        .finally(() => {
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
        });
    });
});
</script>

{% endblock %}
