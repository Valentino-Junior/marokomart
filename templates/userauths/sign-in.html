{% extends 'partials/base.html' %}
{% load static %}
{% block content %}

<style>
    /* ... (previous styles remain the same until the link styles) ... */

    /* Enhanced link styles */
    .heading_s1 a, .text-muted {
        color: blue;
        text-decoration: none;
        position: relative;
        transition: color 0.3s ease;
        font-weight: 500;
    }

    .heading_s1 a::after, .text-muted::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 2px;
        bottom: -2px;
        left: 0;
        background-color: blue;
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.3s ease;
    }

    .heading_s1 a:hover, .text-muted:hover {
        color: blue;
    }

    .heading_s1 a:hover::after, .text-muted:hover::after {
        transform: scaleX(1);
    }

    /* Updated login footer styles */
    .login_footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 1.5rem 0;
        flex-wrap: wrap;
        gap: 10px;
    }

    .custome-checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .form-check-input {
        width: 16px;
        height: 16px;
        margin: 0;
        cursor: pointer;
    }

    .form-check-label {
        cursor: pointer;
        font-size: 14px;
        color: #666;
    }

    /* Password field specific styles */
    .password-field {
        position: relative;
        display: flex;
        align-items: center;
    }

    .password-field input {
        padding-right: 45px;
    }

    .toggle-password {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        color: #666;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 2;
    }

    .toggle-password:hover {
        color: #333;
    }

    .toggle-password:focus {
        outline: none;
        color: blue;
    }

    .toggle-password i {
        font-size: 18px;
        line-height: 1;
    }

    /* Form styles */
    .form-group {
        margin-bottom: 1.5rem;
        position: relative;
    }

    .form-group input {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        transition: all 0.3s ease;
        font-size: 14px;
    }

    .form-group input:focus {
        border-color: blue;
        box-shadow: 0 0 0 2px rgba(59, 183, 126, 0.1);
        outline: none;
    }

    /* Button styles */
    .btn-heading {
        background: blue;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 8px;
        width: 100%;
        font-weight: 600;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        cursor: pointer;
    }

    .btn-heading:hover {
        background: blue;
        transform: translateY(-2px);
    }

    .btn-heading:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
    }

    /* Media queries */
    @media (max-width: 768px) {
        .login_footer {
            flex-direction: column;
            align-items: flex-start;
        }
        
        .heading_s1 {
            text-align: center;
        }
    }
</style>

<main class="main pages">
    <div class="page-header breadcrumb-wrap">
        <div class="container">
            <div class="breadcrumb">
                <a href="{% url 'core:index' %}" rel="nofollow"><i class="fi-rs-home mr-5"></i>Home</a>
                <span></span> Sign in
            </div>
        </div>
    </div>
    <div class="page-content pt-40 pb-150">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-xl-8 col-lg-10 col-md-12 m-auto">
                    <div class="row">
                        <div class="col-lg-6 pr-30 d-none d-lg-block">
                            <img class="border-radius-15" src="{% static 'assets/imgs/maroko1.5.jpg' %}" alt="" style="height: 100%; width: 100%; object-fit: cover; " />
                        </div>
                        <div class="col-lg-6 col-md-8">
                            <div class="login_wrap widget-taber-content background-white">
                                <div class="padding_eight_all bg-white">
                                    {% if messages %}
                                        {% for message in messages %}
                                            <div class="alert alert-{{ message.tags }}">
                                                {{ message }}
                                            </div>
                                        {% endfor %}
                                    {% endif %}

                                    <div class="heading_s1">
                                        <h1 class="mb-5">Login</h1>
                                        <p class="mb-30">Don't have an account? <a href="{% url 'userauths:sign-up' %}">Create here</a></p>
                                    </div>

                                    <form method="POST" id="loginForm"> 
                                        {% csrf_token %}
                                        <div class="form-group">
                                            <input type="email" required name="email" id="email" placeholder="Email Address *" />
                                        </div>
                                        <div class="form-group password-field">
                                            <input required type="password" name="password" id="password" placeholder="Your password *" />
                                            <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                                                <i class="fi-rs-eye"></i>
                                            </button>
                                        </div>
                                        
                                        <div class="login_footer form-group">
                                            <!-- <div class="chek-form">
                                                <div class="custome-checkbox">
                                                    <input class="form-check-input" type="checkbox" name="remember" id="remember" />
                                                    <label class="form-check-label" for="remember">Remember me</label>
                                                </div>
                                            </div> -->
                                            <a class="text-muted" href="{% url 'userauths:password-reset' %}">Forgot password?</a>
                                        </div>
                                        <div class="form-group">
                                            <button type="submit" class="btn btn-heading hover-up" id="loginBtn">
                                                <span>Log in</span>
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const loginForm = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const passwordInput = document.getElementById('password');
    const togglePassword = document.querySelector('.toggle-password');

    // Password toggle functionality
    togglePassword.addEventListener('click', function(e) {
        e.preventDefault();
        
        // Toggle password visibility
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        
        // Toggle icon
        const icon = this.querySelector('i');
        if (type === 'password') {
            icon.className = 'fi-rs-eye';
        } else {
            icon.className = 'fi-rs-eye-crossed';
        }

        // Add click animation
        icon.style.transform = 'scale(0.8)';
        setTimeout(() => {
            icon.style.transform = 'scale(1)';
        }, 100);
    });

    // Form input enhancements
    const formInputs = document.querySelectorAll('input');
    formInputs.forEach(input => {
        // Focus effects
        input.addEventListener('focus', function() {
            this.parentElement.classList.add('focused');
            this.style.borderColor = 'blue';
        });

        input.addEventListener('blur', function() {
            this.parentElement.classList.remove('focused');
            if (!this.value) {
                this.style.borderColor = '#ddd';
            }
        });

        // Maintain border color for filled inputs
        input.addEventListener('input', function() {
            if (this.value) {
                this.style.borderColor = 'blue';
            }
        });
    });

    // Form submission
    loginForm.addEventListener('submit', function(e) {
        // Add loading state to button
        if (!loginBtn.classList.contains('loading')) {
            loginBtn.classList.add('loading');
        }
    });

    // Auto-dismiss alerts after 5 seconds
    const alerts = document.querySelectorAll('.alert');
    alerts.forEach(alert => {
        setTimeout(() => {
            alert.style.opacity = '0';
            alert.style.transition = 'opacity 0.5s ease';
            setTimeout(() => {
                alert.remove();
            }, 500);
        }, 5000);
    });
});
</script>

{% endblock content %}
