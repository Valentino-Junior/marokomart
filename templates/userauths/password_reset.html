{% extends 'partials/base.html' %}
{% load static %}
{% block content %}

<style>
    .password-reset-form {
        max-width: 450px;
        margin: 0 auto;
        padding: 40px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        border-radius: 15px;
        background-color: white;
    }

    .form-title {
        text-align: center;
        margin-bottom: 20px;
        font-size: 28px;
        color: #333;
        margin-top: -20px; /* Adjusted title position */
    }

    .form-subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
        line-height: 1.6;
    }

    .form-group {
        margin-bottom: 1.5rem;
        position: relative;
    }

    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 8px;
        transition: all 0.3s ease;
        font-size: 14px;
    }

    .form-control:focus {
        border-color: blue;
        box-shadow: 0 0 0 2px rgba(59, 183, 126, 0.1);
        outline: none;
    }

    .btn-submit {
        width: 100%;
        padding: 12px;
        background: blue;
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        transition: all 0.3s ease;
        cursor: pointer;
        position: relative;
        overflow: hidden;
    }

    .btn-submit:hover {
        background: blue;
        transform: translateY(-2px);
    }

    .btn-submit.loading {
        pointer-events: none;
        opacity: 0.8;
    }

    .btn-submit.loading::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        top: 50%;
        left: 50%;
        margin: -10px 0 0 -10px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s infinite linear;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    .alert {
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 8px;
        animation: slideIn 0.3s ease;
        display: none;
    }

    .alert-success {
        background-color: #d4edda;
        border: 1px solid #c3e6cb;
        color: blue;
    }

    .alert-error {
        background-color: #f8d7da;
        border: 1px solid #f5c6cb;
        color: #721c24;
    }

    @keyframes slideIn {
        from {
            transform: translateY(-10px);
            opacity: 0;
        }
        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    .page-content {
        padding-top: 100px; /* Reduced top padding */
        padding-bottom: 100px;
    }

    .back-to-login {
        text-align: center;
        margin-top: 20px;
    }

    .back-to-login a {
        color: blue;
        text-decoration: none;
        font-size: 14px;
        position: relative;
    }

    .back-to-login a::after {
        content: '';
        position: absolute;
        width: 100%;
        height: 2px;
        bottom: -2px;
        left: 0;
        background-color: blue;
        transform: scaleX(0);
        transition: transform 0.3s ease;
    }

    .back-to-login a:hover::after {
        transform: scaleX(1);
    }
</style>

<main class="main pages">
    <div class="page-content pt-40">
        <div class="container">
            <div class="row">
                <div class="col-xl-6 col-lg-8 col-md-12 m-auto">
                    <div class="password-reset-form">
                        <h1 class="form-title">Reset Your Password</h1>
                        <p class="form-subtitle">Enter your email address and we'll send you instructions to reset your password.</p>

                        <div class="alert" id="alertMessage"></div>

                        <form method="POST" id="resetForm">
                            {% csrf_token %}
                            <div class="form-group">
                                <input type="email" name="email" required class="form-control" 
                                       placeholder="Enter your email address" />
                            </div>
                            <div class="form-group">
                                <button type="submit" class="btn-submit" id="submitBtn">
                                    Send Reset Link
                                </button>
                            </div>
                        </form>

                        <div class="back-to-login">
                            <a href="{% url 'userauths:sign-in' %}">Back to Login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitBtn');
    const alertMessage = document.getElementById('alertMessage');

    function showAlert(message, type) {
        alertMessage.className = 'alert alert-' + type;
        alertMessage.textContent = message;
        alertMessage.style.display = 'block';
        
        if (type === 'success') {
            setTimeout(() => {
                window.location.href = "{% url 'userauths:sign-in' %}";
            }, 2000);
        }
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Show loading state
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;

        const formData = new FormData(this);

        fetch("{% url 'userauths:password-reset' %}", {
            method: 'POST',
            body: formData,
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                showAlert(data.message, 'success');
                form.reset();
            } else {
                showAlert(data.message, 'error');
            }
        })
        .catch(error => {
            showAlert('An error occurred. Please try again.', 'error');
        })
        .finally(() => {
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
        });
    });
});
</script>

{% endblock %}
