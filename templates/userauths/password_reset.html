{% extends 'partials/base.html' %}
{% load static %}
{% block content %}

<main class="main pages">
    <div class="page-content pt-40">
        <div class="container">
            <div class="row">
                <div class="col-xl-6 col-lg-8 col-md-12 m-auto">
                    <div class="password-reset-form">
                        <div class="form-header">
                            <i class="fas fa-lock reset-icon"></i>
                            <h1 class="form-title">Reset Your Password</h1>
                            <p class="form-subtitle">Enter your email address and we'll send you instructions to reset your password.</p>
                        </div>

                        <!-- Success Message -->
                        <div id="messageBox" class="alert" style="display: none;">
                            <div id="messageText"></div>
                        </div>

                        <form method="POST" id="resetForm">
                            {% csrf_token %}
                            <div class="form-group">
                                <div class="input-wrapper">
                                    <input type="email" name="email" required class="form-control" id="emailInput"
                                           placeholder="Enter your email address" />
                                </div>
                            </div>
                            <div class="form-group">
                                <button type="submit" class="btn-submit" id="submitBtn">Send Reset Link</button>
                            </div>
                        </form>

                        <div class="back-to-login">
                            <a href="{% url 'userauths:sign-in' %}">
                                <i class="fas fa-arrow-left"></i> Back to Login
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<style>
.password-reset-form {
    max-width: 450px;
    margin: 0 auto;
    padding: 40px;
    background: white;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
}

.form-header {
    text-align: center;
    margin-bottom: 30px;
}

.reset-icon {
    font-size: 40px;
    color: blue;
    margin-bottom: 20px;
    background: rgba(0, 0, 255, 0.1);
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 20px;
}

.form-title {
    font-size: 28px;
    color: #333;
    font-weight: 600;
    margin-bottom: 15px;
    font-family: 'Poppins', sans-serif;
}

.form-subtitle {
    color: #666;
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 25px;
}

.input-wrapper {
    position: relative;
}

.input-icon {
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: #aaa;
    transition: color 0.3s;
}

.form-control {
    width: 100%;
    padding: 12px 15px 12px 45px;
    border: 1.5px solid #e0e0e0;
    border-radius: 8px;
    font-size: 14px;
    transition: all 0.3s;
}

.form-control:focus {
    border-color: blue;
    box-shadow: 0 0 0 3px rgba(0, 0, 255, 0.1);
}

.form-control:focus + .input-icon {
    color: blue;
}

.btn-submit {
    width: auto;
    min-width: 160px;
    padding: 12px 30px;
    background: blue;
    color: white;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    transition: all 0.3s ease;
    cursor: pointer;
    display: block;
    margin: 0 auto;
}

.btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0, 0, 255, 0.2);
}

.btn-submit:active {
    transform: translateY(0);
}

.btn-submit.loading {
    color: transparent;
    pointer-events: none;
}

.btn-submit.loading::after {
    content: '';
    position: absolute;
    width: 20px;
    height: 20px;
    top: 50%;
    left: 50%;
    margin: -10px 0 0 -10px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 0.8s linear infinite;
}

.back-to-login {
    text-align: center;
    margin-top: 25px;
}

.back-to-login a {
    color: #666;
    text-decoration: none;
    font-size: 14px;
    transition: color 0.3s;
    display: inline-flex;
    align-items: center;
    gap: 5px;
}

.back-to-login a:hover {
    color: blue;
}

.alert {
    padding: 15px 20px;
    margin-bottom: 20px;
    border-radius: 8px;
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    transition: all 0.3s ease;
}

.alert.show {
    opacity: 1;
    transform: translateY(0);
}

.alert.success {
    background-color: #d4edda;
    border: 1px solid #c3e6cb;
    color: blue;
}

.alert.error {
    background-color: #f8d7da;
    border: 1px solid #f5c6cb;
    color: #721c24;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .password-reset-form {
        padding: 30px 20px;
    }
    
    .form-title {
        font-size: 24px;
    }
    
    .reset-icon {
        width: 60px;
        height: 60px;
        font-size: 30px;
    }
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('resetForm');
    const submitBtn = document.getElementById('submitBtn');
    const emailInput = document.getElementById('emailInput');
    const messageBox = document.getElementById('messageBox');
    const messageText = document.getElementById('messageText');

    function showMessage(message, type) {
        messageText.textContent = message;
        messageBox.className = 'alert ' + type;
        messageBox.style.display = 'block';
        setTimeout(() => messageBox.classList.add('show'), 10);
    }

    function handleSuccess() {
        // Clear form and show success message
        emailInput.value = '';
        showMessage('Password reset instructions have been sent to your email.', 'success');
        submitBtn.textContent = 'Email Sent!';
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Clear any existing messages
        messageBox.style.display = 'none';
        messageBox.classList.remove('show');

        // Show loading state
        submitBtn.classList.add('loading');
        submitBtn.disabled = true;

        fetch("{% url 'userauths:password-reset' %}", {
            method: 'POST',
            body: new FormData(this),
            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            }
        })
        .then(response => response.json())
        .then(data => {
            console.log('Response:', data); // Debug log
            if (data.success) {
                handleSuccess();
            } else {
                showMessage(data.message || 'An error occurred. Please try again.', 'error');
            }
        })
        .catch(error => {
            console.error('Error:', error);
            showMessage('An error occurred. Please try again.', 'error');
        })
        .finally(() => {
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
        });
    });
});
</script>

{% endblock %}
