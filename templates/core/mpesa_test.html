{% extends 'partials/base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card mx-auto" style="max-width: 500px;">
        <div class="card-header">
            <h5>Test M-Pesa STK Push</h5>
        </div>
        <div class="card-body">
            <form id="mpesa-form">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" name="phone_number" placeholder="254XXXXXXXXX" required>
                </div>
                <button type="submit" class="btn btn-primary">Send STK Push</button>
            </form>
            <div id="result" class="mt-3"></div>
        </div>
    </div>
</div>

<script>
document.getElementById('mpesa-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(this);
    document.getElementById('result').innerHTML = 'Processing...';

    fetch('/mpesa-test/', {
        method: 'POST',
        body: formData,
        headers: {'X-Requested-With': 'XMLHttpRequest'}
    })
    .then(r => r.json())
    .then(data => {
        document.getElementById('result').innerHTML = `<pre>${JSON.stringify(data, null, 2)}</pre>`;
    });
});
</script>
{% endblock %}
