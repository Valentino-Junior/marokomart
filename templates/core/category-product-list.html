<script>
    // Wait for DOM to be fully loaded
    document.addEventListener('DOMContentLoaded', function () {
        // Add click handlers for sort options
        document.querySelectorAll('.sort-option').forEach(function (option) {
            option.addEventListener('click', function (e) {
                e.preventDefault();

                // Update current sort text
                document.getElementById('current-sort-text').textContent = this.textContent
                    .trim();

                // Add loading state
                document.getElementById('filtered-product').style.opacity = '0.5';

                // Navigate to the new URL with sort parameter
                window.location.href = this.href;
            });
        });

        // Initialize tooltips if you're using Bootstrap
        if (typeof bootstrap !== 'undefined' && bootstrap.Tooltip) {
            var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
            tooltipTriggerList.map(function (tooltipTriggerEl) {
                return new bootstrap.Tooltip(tooltipTriggerEl);
            });
        }
    });
</script>




<script>
    $(document).ready(function () {
        // Update cart
        $(document).on("click", ".update-product", function () {
            let product_id = $(this).data('product');
            let qty = $('.product-qty-' + product_id).val();

            if (qty < 1) {
                qty = 1;
                $('.product-qty-' + product_id).val(1);
            }

            $.ajax({
                url: '/update-cart/',
                data: {
                    'id': product_id,
                    'qty': qty
                },
                dataType: 'json',
                beforeSend: function () {
                    // Add loading state
                    $(".cart-table").addClass('loading');
                },
                success: function (response) {
                    $("#cart-list").html(response.data);
                    // Update cart count in header
                    if ($('.cart-count').length > 0) {
                        $('.cart-count').text(response.totalcartitems);
                    }
                },
                error: function (error) {
                    console.log('Error:', error);
                    alert('Error updating cart');
                },
                complete: function () {
                    // Remove loading state
                    $(".cart-table").removeClass('loading');
                }
            });
        });

        // Delete from cart
        $(document).on("click", ".delete-product", function () {
            let product_id = $(this).data('product');

            if (confirm('Are you sure you want to remove this item?')) {
                $.ajax({
                    url: '/delete-from-cart/',
                    data: {
                        'id': product_id,
                    },
                    dataType: 'json',
                    beforeSend: function () {
                        // Add loading state
                        $(".cart-table").addClass('loading');
                    },
                    success: function (response) {
                        $("#cart-list").html(response.data);
                        // Update cart count in header
                        if ($('.cart-count').length > 0) {
                            $('.cart-count').text(response.totalcartitems);
                        }
                    },
                    error: function (error) {
                        console.log('Error:', error);
                        alert('Error removing item from cart');
                    },
                    complete: function () {
                        // Remove loading state
                        $(".cart-table").removeClass('loading');
                    }
                });
            }
        });
    });
</script>
